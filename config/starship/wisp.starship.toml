# ── wisp ─────────────────────────────────────────────
#   quiet light, marsh-night prompt
#   glow #8ef0d2 · shimmer #b3a6f0 · fog #ccdfdb
# ─────────────────────────────────────────────────────

add_newline = true
command_timeout = 1000
palette = "wisp"

format = """
$username$hostname$directory$git_branch$git_status$python$nodejs$rust$cmd_duration$line_break\
$character\
"""

right_format = "$status$jobs$time"

[palettes.wisp]
night   = "#0a0f14"
glow    = "#8ef0d2"
shimmer = "#b3a6f0"
mist    = "#3a4750"
fog     = "#ccdfdb"
rose    = "#e06a8a"
gold    = "#d8d49a"
water   = "#8ac6e3"
moss    = "#7ee8b4"

# the light you type beside
[character]
success_symbol = "[✦](bold glow)"
error_symbol = "[✦](bold rose)"
vimcmd_symbol = "[❮](bold shimmer)"
vimcmd_visual_symbol = "[❮](bold gold)"

[directory]
style = "bold fog"
read_only = " 󰌾"
read_only_style = "rose"
truncation_length = 4
truncate_to_repo = false
truncation_symbol = ".../"
home_symbol = "~"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "shimmer"
format = "[$symbol$branch]($style) "

[git_status]
style = "mist"
format = "([$all_status$ahead_behind]($style) )"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[cmd_duration]
min_time = 2000
style = "gold"
format = "[󱫐 $duration]($style) "

[time]
disabled = false
style = "mist"
format = "[$time]($style)"
time_format = "%H:%M"

[status]
disabled = false
style = "rose"
format = "[✘ $status]($style) "

[jobs]
style = "shimmer"
symbol = "✦"
format = "[$symbol$number]($style) "

# only when drifting onto other machines
[username]
show_always = false
style_user = "moss"
style_root = "rose"
format = "[$user]($style)[@](mist)"

[hostname]
ssh_only = true
style = "water"
format = "[$hostname]($style) "

[python]
symbol = "󰌠 "
style = "gold"
format = "[$symbol$pyenv_prefix($version )(\\($virtualenv\\) )]($style)"

[nodejs]
symbol = "󰎙 "
style = "moss"
format = "[$symbol($version )]($style)"

[rust]
symbol = "󱘗 "
style = "rose"
format = "[$symbol($version )]($style)"
