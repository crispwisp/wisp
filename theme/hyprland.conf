# wisp — borders glow like the light itself
$activeBorderColor = rgba(8ef0d2ee) rgba(b3a6f0cc) 45deg
$inactiveBorderColor = rgba(1d2b33aa)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
}

group {
    col.border_active = $activeBorderColor
}

decoration {
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(8ef0d240)
        color_inactive = rgba(05080c66)
    }
}
